name: Publish Static Demo

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Prepare Pages artifact
        run: |
          mkdir -p dist
          cp index.html app.js styles.css README.md .gitignore dist/
          cp -R assets dist/assets
          REPO_NAME="${GITHUB_REPOSITORY#*/}"
          sed -i "s|<base href=\"/\">|<base href=\"/${REPO_NAME}/\">|" dist/index.html
          for route in merchant merchant/payments merchant/send merchant/convert merchant/cards merchant/crypto casino-window; do
            mkdir -p "dist/${route}"
            cp dist/index.html "dist/${route}/index.html"
          done
          touch dist/.nojekyll

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
